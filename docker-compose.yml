services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edupro
      POSTGRES_PASSWORD: edupro_secret
      POSTGRES_DB: edupro
    volumes:
      - edupro_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupro -d edupro"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://edupro:edupro_secret@db:5432/edupro?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-openssl-rand}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: Edupro
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost:3000}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  edupro_pg:
