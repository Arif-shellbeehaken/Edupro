openapi: 3.0.3
info:
  title: Edupro API v1
  version: 1.0.0
  description: |
    Tenant-scoped REST for mobile apps and integrations.
    Auth: session cookie (staff) OR `x-api-key` / `Authorization: Bearer <key>`.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /students:
    get:
      summary: List students
      parameters:
        - in: query
          name: status
          schema: { type: string, default: ACTIVE }
        - in: query
          name: take
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Student list
        "401":
          description: Unauthorized
        "429":
          description: Rate limited
  /attendance:
    get:
      summary: List attendance rows
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: take
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Attendance list
  /notices:
    get:
      summary: Published notices
      parameters:
        - in: query
          name: take
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Notices
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
